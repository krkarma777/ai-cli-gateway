name: npm Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-release-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.artifact-metadata.outputs.artifact_id }}
      artifact_digest: ${{ steps.artifact-metadata.outputs.artifact_digest }}
    steps:
      - name: Validate immutable release metadata
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          umask 077
          readonly repository=krkarma777/ai-cli-gateway
          readonly commit_pattern='^[0-9a-f]{40}$'
          readonly release_id_pattern='^[1-9][0-9]*$'
          test "${EVENT_NAME}" = workflow_dispatch
          test "${EVENT_REPOSITORY}" = "${repository}"
          test "${INPUT_TAG}" = v0.2.2
          test "${EVENT_REF}" = "refs/tags/${INPUT_TAG}"
          [[ "${EVENT_SHA}" =~ ${commit_pattern} ]]
          command -v gh >/dev/null
          command -v jq >/dev/null
          gh --version >/dev/null
          jq --version >/dev/null

          resolve_live_tag() {
            local ref_response object_type object_sha tag_response resolved
            ref_response="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${repository}/git/ref/tags/${INPUT_TAG}")" || return 1
            jq -e --arg ref "refs/tags/${INPUT_TAG}" '
              type == "object" and
              .ref == $ref and
              (.object | type == "object") and
              (.object.type == "commit" or .object.type == "tag") and
              (.object.sha | type == "string" and test("^[0-9a-f]{40}$"))
            ' >/dev/null <<<"${ref_response}" || return 1
            object_type="$(jq -r '.object.type' <<<"${ref_response}")" || return 1
            object_sha="$(jq -r '.object.sha' <<<"${ref_response}")" || return 1
            if test "${object_type}" = commit; then
              printf '%s\n' "${object_sha}"
              return 0
            fi
            tag_response="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${repository}/git/tags/${object_sha}")" || return 1
            jq -e --arg requested "${object_sha}" '
              type == "object" and
              .sha == $requested and
              (.object | type == "object") and
              .object.type == "commit" and
              (.object.sha | type == "string" and test("^[0-9a-f]{40}$"))
            ' >/dev/null <<<"${tag_response}" || return 1
            resolved="$(jq -r '.object.sha' <<<"${tag_response}")" || return 1
            [[ "${resolved}" =~ ${commit_pattern} ]] || return 1
            printf '%s\n' "${resolved}"
          }

          tag_commit="$(resolve_live_tag)"
          [[ "${tag_commit}" =~ ${commit_pattern} ]]
          test "${EVENT_SHA}" = "${tag_commit}"

          release_response="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${repository}/releases/tags/${INPUT_TAG}")"
          jq -e --arg tag "${INPUT_TAG}" '
            type == "object" and
            (.id | type == "number" and . > 0 and floor == .) and
            (.tag_name == $tag) and
            (.draft == false) and
            (.prerelease == false) and
            (.immutable == true) and
            (.published_at | type == "string" and length > 0) and
            (.assets | type == "array" and length == 7)
          ' >/dev/null <<<"${release_response}"
          release_id="$(jq -r '.id' <<<"${release_response}")"
          [[ "${release_id}" =~ ${release_id_pattern} ]]
          {
            printf 'tag=%s\n' "${INPUT_TAG}"
            printf 'version=%s\n' "${INPUT_TAG#v}"
            printf 'tag_commit=%s\n' "${tag_commit}"
            printf 'release_id=%s\n' "${release_id}"
          } >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.metadata.outputs.tag_commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.5
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.13.0"
          package-manager-cache: false
      - name: Validate toolchain and source
        shell: bash
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          TAG_COMMIT: ${{ steps.metadata.outputs.tag_commit }}
        run: |
          set -euo pipefail
          umask 077
          test "${TAG}" = v0.2.2
          test "${VERSION}" = 0.2.2
          [[ "${TAG_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${TAG_COMMIT}"
          test "$(git rev-parse "${TAG}^{commit}")" = "${TAG_COMMIT}"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${TAG_COMMIT}" refs/remotes/origin/main
          test "$(go env GOVERSION)" = go1.26.5
          test "$(node --version)" = v24.13.0
          test "$(npm --version)" = 11.6.2
          test "$(node -p 'require("./npm/launcher/package.json").version')" = "${VERSION}"
          node npm/scripts/verify-packages.js --source-check
      - name: Download and verify immutable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          TAG_COMMIT: ${{ steps.metadata.outputs.tag_commit }}
        run: |
          set -euo pipefail
          umask 077
          readonly repository=krkarma777/ai-cli-gateway
          readonly asset_root="${RUNNER_TEMP}/immutable-release-assets"
          readonly checksum_pattern='^([0-9a-f]{64}) \*([A-Za-z0-9._-]+)$'
          test "${TAG}" = v0.2.2
          test "${VERSION}" = 0.2.2
          [[ "${TAG_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          command -v gh >/dev/null
          command -v jq >/dev/null
          command -v sha256sum >/dev/null
          command -v stat >/dev/null
          test ! -e "${asset_root}"
          install -d -m 0700 "${asset_root}"

          release_response="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${repository}/releases/tags/${TAG}")"
          jq -e --arg tag "${TAG}" '
            type == "object" and
            (.tag_name == $tag) and
            (.draft == false) and
            (.prerelease == false) and
            (.immutable == true) and
            (.assets | type == "array" and length == 7)
          ' >/dev/null <<<"${release_response}"
          expected_assets="$(LC_ALL=C sort <<'ASSETS'
          SHA256SUMS
          ai-cli-gateway_0.2.2_darwin_amd64.tar.gz
          ai-cli-gateway_0.2.2_darwin_arm64.tar.gz
          ai-cli-gateway_0.2.2_linux_amd64.tar.gz
          ai-cli-gateway_0.2.2_linux_arm64.tar.gz
          ai-cli-gateway_0.2.2_sbom.spdx.json
          ai-cli-gateway_0.2.2_windows_amd64.zip
          ASSETS
          )"
          api_assets="$(jq -r '.assets[].name' <<<"${release_response}" | LC_ALL=C sort)"
          test "${api_assets}" = "${expected_assets}"

          gh release download "${TAG}" --repo "${repository}" --dir "${asset_root}" \
            --pattern SHA256SUMS \
            --pattern ai-cli-gateway_0.2.2_linux_amd64.tar.gz \
            --pattern ai-cli-gateway_0.2.2_linux_arm64.tar.gz \
            --pattern ai-cli-gateway_0.2.2_darwin_amd64.tar.gz \
            --pattern ai-cli-gateway_0.2.2_darwin_arm64.tar.gz \
            --pattern ai-cli-gateway_0.2.2_windows_amd64.zip \
            --pattern ai-cli-gateway_0.2.2_sbom.spdx.json
          downloaded_assets="$(find "${asset_root}" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          test "${downloaded_assets}" = "${expected_assets}"
          test "$(find "${asset_root}" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 7

          effective_uid="$(id -u)"
          while IFS= read -r asset; do
            record="$(jq -er --arg asset "${asset}" '
              [.assets[] | select(.name == $asset)] |
              if length == 1 then .[0] else error("asset cardinality") end |
              [.size, .digest, .state] | @tsv
            ' <<<"${release_response}")"
            IFS=$'\t' read -r api_size api_digest api_state <<<"${record}"
            [[ "${api_size}" =~ ^[1-9][0-9]*$ ]]
            [[ "${api_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "${api_state}" = uploaded
            case "${asset}" in
              SHA256SUMS) test "${api_size}" -le 65536 ;;
              *_sbom.spdx.json) test "${api_size}" -le 52428800 ;;
              *) test "${api_size}" -le 104857600 ;;
            esac
            filename="${asset_root}/${asset}"
            test -f "${filename}"
            test ! -L "${filename}"
            test "$(stat -c '%h' -- "${filename}")" = 1
            test "$(stat -c '%u' -- "${filename}")" = "${effective_uid}"
            test "$(stat -c '%s' -- "${filename}")" = "${api_size}"
            actual_digest="$(sha256sum -- "${filename}" | awk '{print $1}')"
            test "sha256:${actual_digest}" = "${api_digest}"
          done <<<"${expected_assets}"

          checksum_names=()
          while IFS= read -r checksum_line || test -n "${checksum_line}"; do
            [[ "${checksum_line}" =~ ${checksum_pattern} ]]
            checksum_names+=("${BASH_REMATCH[2]}")
          done < "${asset_root}/SHA256SUMS"
          actual_checksum_names="$(printf '%s\n' "${checksum_names[@]}" | LC_ALL=C sort)"
          expected_checksum_names="$(LC_ALL=C sort <<'CHECKSUMS'
          ai-cli-gateway_0.2.2_darwin_amd64.tar.gz
          ai-cli-gateway_0.2.2_darwin_arm64.tar.gz
          ai-cli-gateway_0.2.2_linux_amd64.tar.gz
          ai-cli-gateway_0.2.2_linux_arm64.tar.gz
          ai-cli-gateway_0.2.2_sbom.spdx.json
          ai-cli-gateway_0.2.2_windows_amd64.zip
          CHECKSUMS
          )"
          test "${actual_checksum_names}" = "${expected_checksum_names}"
          (
            cd "${asset_root}"
            sha256sum --check --strict SHA256SUMS
          )
          while IFS= read -r asset; do
            gh attestation verify "${asset_root}/${asset}" \
              --repo krkarma777/ai-cli-gateway \
              --predicate-type https://slsa.dev/provenance/v1 \
              --signer-workflow github.com/krkarma777/ai-cli-gateway/.github/workflows/release.yml \
              --source-digest "${TAG_COMMIT}" \
              --source-ref "refs/tags/${TAG}"
          done <<<"${expected_assets}"
      - name: Rebuild and compare release archives
        id: build-metadata
        shell: bash
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          TAG_COMMIT: ${{ steps.metadata.outputs.tag_commit }}
        run: |
          set -euo pipefail
          umask 077
          readonly asset_root="${RUNNER_TEMP}/immutable-release-assets"
          readonly build_root="${RUNNER_TEMP}/npm-release-build"
          readonly binary_root="${build_root}/binaries"
          readonly rebuilt_root="${build_root}/archives"
          readonly releasepack_bin="${build_root}/releasepack"
          test "${TAG}" = v0.2.2
          test "${VERSION}" = 0.2.2
          [[ "${TAG_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          test ! -e "${build_root}"
          install -d -m 0700 "${build_root}" "${binary_root}" "${rebuilt_root}"
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64; do
            install -d -m 0700 "${binary_root}/${target}"
          done
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -mod=readonly \
            -o "${releasepack_bin}" ./internal/releasepack/cmd/releasepack

          source_epoch="$(git show -s --format=%ct "${TAG_COMMIT}")"
          [[ "${source_epoch}" =~ ^[0-9]+$ ]]
          source_date="$(date -u -d "@${source_epoch}" '+%Y-%m-%dT%H:%M:%SZ')"
          [[ "${source_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          ldflags="-s -w -X github.com/krkarma777/ai-cli-gateway/internal/buildinfo.Version=${TAG} -X github.com/krkarma777/ai-cli-gateway/internal/buildinfo.Commit=${TAG_COMMIT} -X github.com/krkarma777/ai-cli-gateway/internal/buildinfo.Date=${source_date}"
          while read -r goos goarch directory executable; do
            destination="${binary_root}/${directory}/${executable}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath -buildvcs=false -mod=readonly -ldflags "${ldflags}" \
              -o "${destination}" ./cmd/ai-cli-gateway
            build_info="$(go version -m "${destination}")"
            grep -F $'path\tgithub.com/krkarma777/ai-cli-gateway/cmd/ai-cli-gateway' <<<"${build_info}" >/dev/null
            grep -F "GOOS=${goos}" <<<"${build_info}" >/dev/null
            grep -F "GOARCH=${goarch}" <<<"${build_info}" >/dev/null
          done <<'TARGETS'
          linux amd64 linux_amd64 ai-cli-gateway
          linux arm64 linux_arm64 ai-cli-gateway
          darwin amd64 darwin_amd64 ai-cli-gateway
          darwin arm64 darwin_arm64 ai-cli-gateway
          windows amd64 windows_amd64 ai-cli-gateway.exe
          TARGETS
          test "$("${binary_root}/linux_amd64/ai-cli-gateway" version)" = "ai-cli-gateway ${TAG} (${TAG_COMMIT}, ${source_date})"
          "${releasepack_bin}" archives \
            --repository-root "${GITHUB_WORKSPACE}" \
            --staging-root "${binary_root}" \
            --output-root "${rebuilt_root}" \
            --tag "${TAG}" \
            --source-epoch "${source_epoch}"

          while IFS= read -r archive; do
            expected_digest="$(awk -v marker="*${archive}" '$2 == marker && NF == 2 { print $1 }' "${asset_root}/SHA256SUMS")"
            [[ "${expected_digest}" =~ ^[0-9a-f]{64}$ ]]
            actual_digest="$(sha256sum -- "${rebuilt_root}/${archive}" | awk '{print $1}')"
            test "${actual_digest}" = "${expected_digest}"
          done <<ARCHIVES
          ai-cli-gateway_${VERSION}_linux_amd64.tar.gz
          ai-cli-gateway_${VERSION}_linux_arm64.tar.gz
          ai-cli-gateway_${VERSION}_darwin_amd64.tar.gz
          ai-cli-gateway_${VERSION}_darwin_arm64.tar.gz
          ai-cli-gateway_${VERSION}_windows_amd64.zip
          ARCHIVES
          printf 'source_date=%s\n' "${source_date}" >> "${GITHUB_OUTPUT}"
      - name: Stage and inspect npm packages
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          readonly binary_root="${RUNNER_TEMP}/npm-release-build/binaries"
          readonly work_root="${RUNNER_TEMP}/npm-package-work"
          readonly staging_root="${work_root}/staging"
          readonly tarball_root="${work_root}/tarballs"
          readonly descriptor="${tarball_root}/packages.json"
          test "${VERSION}" = 0.2.2
          test ! -e "${work_root}"
          install -d -m 0700 "${work_root}" "${tarball_root}"
          node npm/scripts/stage-packages.js \
            --repository-root "${GITHUB_WORKSPACE}" \
            --binary-root "${binary_root}" \
            --output-root "${staging_root}" \
            --version "${VERSION}"
          node npm/scripts/verify-packages.js \
            --staging-root "${staging_root}" \
            --tarball-root "${tarball_root}" \
            --descriptor "${descriptor}" \
            --version "${VERSION}"

          export NPM_TARBALL_ROOT="${tarball_root}"
          node --input-type=module <<'NODE'
          import { lstatSync, readFileSync, readdirSync } from "node:fs";
          import path from "node:path";

          const root = process.env.NPM_TARBALL_ROOT;
          const names = [
            "ai-cli-gateway-darwin-x64",
            "ai-cli-gateway-darwin-arm64",
            "ai-cli-gateway-linux-x64",
            "ai-cli-gateway-linux-arm64",
            "ai-cli-gateway-win32-x64",
            "ai-cli-gateway",
          ];
          const filenames = names.map((name) => `${name}-0.2.2.tgz`);
          const descriptor = JSON.parse(readFileSync(path.join(root, "packages.json"), "utf8"));
          if (!Array.isArray(descriptor) || descriptor.length !== names.length) process.exit(1);
          for (let index = 0; index < names.length; index += 1) {
            const value = descriptor[index];
            if (
              value === null || typeof value !== "object" || Array.isArray(value) ||
              JSON.stringify(Object.keys(value).sort()) !== JSON.stringify(["filename", "files", "integrity", "name", "shasum", "size", "version"]) ||
              value.name !== names[index] || value.version !== "0.2.2" ||
              value.filename !== filenames[index] ||
              !/^sha512-[A-Za-z0-9+/]{86}==$/.test(value.integrity) ||
              !/^[0-9a-f]{40}$/.test(value.shasum) ||
              !Number.isSafeInteger(value.size) || value.size <= 0 ||
              !Array.isArray(value.files) || value.files.length === 0
            ) process.exit(1);
            const metadata = lstatSync(path.join(root, value.filename));
            if (!metadata.isFile() || metadata.isSymbolicLink() || metadata.nlink !== 1) process.exit(1);
          }
          const expectedEntries = [...filenames, "packages.json"].sort();
          if (JSON.stringify(readdirSync(root).sort()) !== JSON.stringify(expectedEntries)) process.exit(1);
          NODE
      - name: Install and execute Linux x64 package
        shell: bash
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          TAG_COMMIT: ${{ steps.metadata.outputs.tag_commit }}
          SOURCE_DATE: ${{ steps.build-metadata.outputs.source_date }}
        run: |
          set -euo pipefail
          umask 077
          readonly tarball_root="${RUNNER_TEMP}/npm-package-work/tarballs"
          readonly install_root="${RUNNER_TEMP}/npm-package-install"
          test "${TAG}" = v0.2.2
          [[ "${TAG_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          test ! -e "${install_root}"
          install -d -m 0700 "${install_root}"
          npm install --global --ignore-scripts --no-audit --no-fund \
            --prefix "${install_root}" \
            "${tarball_root}/ai-cli-gateway-linux-x64-0.2.2.tgz" \
            "${tarball_root}/ai-cli-gateway-0.2.2.tgz"
          readonly shim="${install_root}/bin/ai-cli-gateway"
          test -x "${shim}"
          version_output="$("${shim}" version)"
          test "${version_output}" = "ai-cli-gateway ${TAG} (${TAG_COMMIT}, ${SOURCE_DATE})"
      - name: Upload verified npm packages
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-packages-v0.2.2
          path: |
            ${{ runner.temp }}/npm-package-work/tarballs/ai-cli-gateway-darwin-x64-0.2.2.tgz
            ${{ runner.temp }}/npm-package-work/tarballs/ai-cli-gateway-darwin-arm64-0.2.2.tgz
            ${{ runner.temp }}/npm-package-work/tarballs/ai-cli-gateway-linux-x64-0.2.2.tgz
            ${{ runner.temp }}/npm-package-work/tarballs/ai-cli-gateway-linux-arm64-0.2.2.tgz
            ${{ runner.temp }}/npm-package-work/tarballs/ai-cli-gateway-win32-x64-0.2.2.tgz
            ${{ runner.temp }}/npm-package-work/tarballs/ai-cli-gateway-0.2.2.tgz
            ${{ runner.temp }}/npm-package-work/tarballs/packages.json
          overwrite: false
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 1
      - name: Validate artifact outputs
        id: artifact-metadata
        shell: bash
        env:
          RAW_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          RAW_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "${RAW_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${RAW_ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          {
            printf 'artifact_id=%s\n' "${RAW_ARTIFACT_ID}"
            printf 'artifact_digest=%s\n' "${RAW_ARTIFACT_DIGEST}"
          } >> "${GITHUB_OUTPUT}"

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.13.0"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - name: Install trusted-publishing npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.19.1
          test "$(npm --version)" = 11.19.1
      - name: Validate npm trusted-publishing identity
        shell: bash
        env:
          EXPECTED_TAG: v0.2.2
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const required = (name) => {
            const value = process.env[name];
            if (typeof value !== "string" || value.length === 0) process.exit(1);
            return value;
          };

          const tag = required("EXPECTED_TAG");
          const endpoint = new URL(required("ACTIONS_ID_TOKEN_REQUEST_URL"));
          endpoint.searchParams.set("audience", "npm:registry.npmjs.org");
          const response = await fetch(endpoint, {
            headers: {
              Accept: "application/json",
              Authorization: `Bearer ${required("ACTIONS_ID_TOKEN_REQUEST_TOKEN")}`,
            },
          });
          if (!response.ok) process.exit(1);
          const body = await response.json();
          if (body === null || typeof body !== "object" || typeof body.value !== "string") {
            process.exit(1);
          }
          const parts = body.value.split(".");
          if (parts.length !== 3) process.exit(1);
          const claims = JSON.parse(Buffer.from(parts[1], "base64url").toString("utf8"));
          const expected = {
            aud: "npm:registry.npmjs.org",
            repository: "krkarma777/ai-cli-gateway",
            workflow_ref: `krkarma777/ai-cli-gateway/.github/workflows/npm-release.yml@refs/tags/${tag}`,
            ref: `refs/tags/${tag}`,
            sha: required("GITHUB_SHA"),
            event_name: "workflow_dispatch",
            runner_environment: "github-hosted",
            repository_visibility: "public",
          };
          for (const [name, value] of Object.entries(expected)) {
            if (claims[name] !== value) process.exit(1);
          }
          NODE
      - name: Validate artifact identity
        shell: bash
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EXPECTED_ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
      - name: Download verified npm packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: ${{ runner.temp }}/npm-artifact-archive
          digest-mismatch: error
          skip-decompress: true
      - name: Validate and extract npm artifact
        shell: bash
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          umask 077
          readonly archive_root="${RUNNER_TEMP}/npm-artifact-archive"
          readonly package_root="${RUNNER_TEMP}/npm-packages"
          [[ "${EXPECTED_ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          command -v sha256sum >/dev/null
          command -v stat >/dev/null
          command -v unzip >/dev/null
          test -d "${archive_root}"
          test ! -L "${archive_root}"
          test -z "$(find "${archive_root}" -type l -print -quit)"
          mapfile -d '' -t archive_files < <(find "${archive_root}" -type f -print0)
          test "${#archive_files[@]}" = 1
          artifact_archive="${archive_files[0]}"
          test -f "${artifact_archive}"
          test ! -L "${artifact_archive}"
          test "$(stat -c '%h' -- "${artifact_archive}")" = 1
          actual_artifact_digest="$(sha256sum -- "${artifact_archive}" | awk '{print $1}')"
          test "${actual_artifact_digest}" = "${EXPECTED_ARTIFACT_DIGEST}"

          expected_entries="$(LC_ALL=C sort <<'PACKAGES'
          ai-cli-gateway-0.2.2.tgz
          ai-cli-gateway-darwin-arm64-0.2.2.tgz
          ai-cli-gateway-darwin-x64-0.2.2.tgz
          ai-cli-gateway-linux-arm64-0.2.2.tgz
          ai-cli-gateway-linux-x64-0.2.2.tgz
          ai-cli-gateway-win32-x64-0.2.2.tgz
          packages.json
          PACKAGES
          )"
          actual_entries="$(unzip -Z1 "${artifact_archive}" | LC_ALL=C sort)"
          test "${actual_entries}" = "${expected_entries}"
          test "$(wc -l <<<"${actual_entries}" | tr -d ' ')" = 7
          test ! -e "${package_root}"
          install -d -m 0700 "${package_root}"
          unzip -q "${artifact_archive}" -d "${package_root}"
          test ! -L "${package_root}"
          extracted_entries="$(find "${package_root}" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          test "${extracted_entries}" = "${expected_entries}"
          test "$(find "${package_root}" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 7
      - name: Publish verified npm packages
        shell: bash
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact_digest }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          set -euo pipefail
          umask 077
          readonly package_root="${RUNNER_TEMP}/npm-packages"
          readonly registry_root="${RUNNER_TEMP}/npm-registry-checks"
          test "$(node --version)" = v24.13.0
          test "$(npm --version)" = 11.19.1
          [[ "${EXPECTED_ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          test ! -e "${registry_root}"
          install -d -m 0700 "${registry_root}"

          descriptor_records="$(node --input-type=module - "${package_root}" <<'NODE'
          import { createHash } from "node:crypto";
          import { lstatSync, readFileSync, readdirSync } from "node:fs";
          import path from "node:path";

          const root = path.resolve(process.argv[2]);
          const names = [
            "ai-cli-gateway-darwin-x64",
            "ai-cli-gateway-darwin-arm64",
            "ai-cli-gateway-linux-x64",
            "ai-cli-gateway-linux-arm64",
            "ai-cli-gateway-win32-x64",
            "ai-cli-gateway",
          ];
          const filenames = names.map((name) => `${name}-0.2.2.tgz`);
          const expectedEntries = [...filenames, "packages.json"].sort();
          if (JSON.stringify(readdirSync(root).sort()) !== JSON.stringify(expectedEntries)) process.exit(1);
          const descriptorPath = path.join(root, "packages.json");
          const descriptorMetadata = lstatSync(descriptorPath);
          if (!descriptorMetadata.isFile() || descriptorMetadata.isSymbolicLink() || descriptorMetadata.nlink !== 1) process.exit(1);
          const values = JSON.parse(readFileSync(descriptorPath, "utf8"));
          if (!Array.isArray(values) || values.length !== names.length) process.exit(1);
          for (let index = 0; index < names.length; index += 1) {
            const value = values[index];
            const filename = path.join(root, filenames[index]);
            const metadata = lstatSync(filename);
            if (
              value === null || typeof value !== "object" || Array.isArray(value) ||
              JSON.stringify(Object.keys(value).sort()) !== JSON.stringify(["filename", "files", "integrity", "name", "shasum", "size", "version"]) ||
              value.name !== names[index] || value.version !== "0.2.2" || value.filename !== filenames[index] ||
              !/^sha512-[A-Za-z0-9+/]{86}==$/.test(value.integrity) || !/^[0-9a-f]{40}$/.test(value.shasum) ||
              !Number.isSafeInteger(value.size) || value.size <= 0 || !Array.isArray(value.files) || value.files.length === 0 ||
              !metadata.isFile() || metadata.isSymbolicLink() || metadata.nlink !== 1 || metadata.size !== value.size
            ) process.exit(1);
            const content = readFileSync(filename);
            const integrity = `sha512-${createHash("sha512").update(content).digest("base64")}`;
            const shasum = createHash("sha1").update(content).digest("hex");
            if (integrity !== value.integrity || shasum !== value.shasum) process.exit(1);
            process.stdout.write(`${value.name}\t${value.filename}\t${value.integrity}\n`);
          }
          NODE
          )"
          mapfile -t records <<<"${descriptor_records}"
          test "${#records[@]}" = 6
          packages=(
            ai-cli-gateway-darwin-x64
            ai-cli-gateway-darwin-arm64
            ai-cli-gateway-linux-x64
            ai-cli-gateway-linux-arm64
            ai-cli-gateway-win32-x64
            ai-cli-gateway
          )
          filenames=()
          integrities=()
          for index in "${!packages[@]}"; do
            IFS=$'\t' read -r record_name record_filename record_integrity <<<"${records[${index}]}"
            test "${record_name}" = "${packages[${index}]}"
            [[ "${record_filename}" =~ ^ai-cli-gateway(-[a-z0-9-]+)?-0[.]2[.]2[.]tgz$ ]]
            [[ "${record_integrity}" =~ ^sha512-[A-Za-z0-9+/]{86}==$ ]]
            filenames+=("${record_filename}")
            integrities+=("${record_integrity}")
            tarball="${package_root}/${record_filename}"
            actual_integrity="$(node -e 'const c=require("node:crypto"),f=require("node:fs"),p=process.argv[1],s=f.lstatSync(p);if(!s.isFile()||s.isSymbolicLink()||s.nlink!==1)process.exit(1);process.stdout.write("sha512-"+c.createHash("sha512").update(f.readFileSync(p)).digest("base64"));' "${tarball}")"
            test "${actual_integrity}" = "${integrities[${index}]}"
          done

          statuses=()
          for index in "${!packages[@]}"; do
            package_spec="${packages[${index}]}@0.2.2"
            stdout_file="${registry_root}/${index}.stdout"
            stderr_file="${registry_root}/${index}.stderr"
            if npm view "${package_spec}" dist.integrity --json >"${stdout_file}" 2>"${stderr_file}"; then
              remote_integrity="$(node -e 'const f=require("node:fs"),v=JSON.parse(f.readFileSync(process.argv[1],"utf8"));if(typeof v!=="string"||!/^sha512-[A-Za-z0-9+/]{86}==$/.test(v))process.exit(1);process.stdout.write(v);' "${stdout_file}")"
              test "${remote_integrity}" = "${integrities[${index}]}"
              statuses+=(present)
            else
              node --input-type=module - "${stdout_file}" "${package_spec}" "${packages[${index}]}" <<'E404'
          import { readFileSync } from "node:fs";
          const failure = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const packageSpec = process.argv[3];
          const packageName = process.argv[4];
          if (
            failure === null || typeof failure !== "object" || Array.isArray(failure) ||
            JSON.stringify(Object.keys(failure)) !== JSON.stringify(["error"]) ||
            failure.error === null || typeof failure.error !== "object" || Array.isArray(failure.error) ||
            JSON.stringify(Object.keys(failure.error).sort()) !== JSON.stringify(["code", "detail", "summary"]) ||
            failure.error.code !== "E404" || typeof failure.error.summary !== "string" || typeof failure.error.detail !== "string" ||
            !failure.error.summary.startsWith(`Not Found - GET https://registry.npmjs.org/${packageName} - `) ||
            !failure.error.detail.includes(`'${packageSpec}'`)
          ) process.exit(1);
          E404
              test "$(awk '/^npm error code / { count++ } END { print count + 0 }' "${stderr_file}")" = 1
              grep -Fx 'npm error code E404' "${stderr_file}" >/dev/null
              statuses+=(absent)
            fi
          done

          for index in "${!packages[@]}"; do
            if test "${statuses[${index}]}" = present; then
              continue
            fi
            tarball="${package_root}/${filenames[${index}]}"
            npm publish "${tarball}" --ignore-scripts --access public --provenance
            package_spec="${packages[${index}]}@0.2.2"
            post_stdout="${registry_root}/${index}.post.stdout"
            post_stderr="${registry_root}/${index}.post.stderr"
            npm view "${package_spec}" dist.integrity --json >"${post_stdout}" 2>"${post_stderr}"
            remote_integrity="$(node -e 'const f=require("node:fs"),v=JSON.parse(f.readFileSync(process.argv[1],"utf8"));if(typeof v!=="string"||!/^sha512-[A-Za-z0-9+/]{86}==$/.test(v))process.exit(1);process.stdout.write(v);' "${post_stdout}")"
            test "${remote_integrity}" = "${integrities[${index}]}"
          done
